name: CI

# The tests run the scripts against a stand-in for tofu and a local bare repository, so
# nothing here touches GitHub or the real state. The OpenTofu job adds the tests that
# need OpenTofu itself: fmt, validate, tofu test with the github provider mocked, and
# decoding the definitions the scripts write.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  node-smoke:
    name: Node smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Generate and exercise Node starter
        run: npm run smoke

  starter-smoke:
    name: Starter smoke (${{ matrix.language }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        language: [csharp, rust, java, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # As with Maven below, the starter's project files live outside the checkout, so setup-dotnet's
      # cache has nothing to key on. The package versions live in csharp.ts.
      - if: matrix.language == 'csharp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('scripts/starters/csharp.ts') }}
          restore-keys: nuget-${{ runner.os }}-

      # The runner images include Maven; setup-java pins the JDK the starter targets.
      - if: matrix.language == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The starter writes its pom.xml outside the checkout, so setup-java's cache has nothing
      # to key on. Its dependency versions live in java.ts instead. A warm cache means a
      # Maven Central outage rarely fails the job.
      - if: matrix.language == 'java'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('scripts/starters/java.ts') }}
          restore-keys: maven-${{ runner.os }}-

      # The starter has no dependencies, so there is no go.sum to key a cache on.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The runner images include rustup; the starter lints with Clippy.
      - if: matrix.language == 'rust'
        run: rustup component add clippy

      - run: npm ci

      - name: Generate and exercise the ${{ matrix.language }} starter
        run: npm run smoke:starter -- ${{ matrix.language }}

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - run: npm ci
      - run: npm run test:tofu

  # The one check the Main ruleset requires from this workflow, so the matrices can change
  # without touching repositories/SubZeroDev.GitHub.yaml.
  result:
    name: CI result
    if: always()
    needs: [test, node-smoke, starter-smoke, tofu]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
