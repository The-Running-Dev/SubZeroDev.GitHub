name: CI

# Pester runs the scripts against a stand-in for tofu and a local bare repository, so
# nothing here touches GitHub or the real state. The Tofu job adds the tests that need
# OpenTofu itself: fmt, validate, and tofu test with the github provider mocked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  pester:
    name: Pester
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pwsh-ci.yml@v1
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      tests: tests
      exclude-tags: Tofu

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Only satisfies the variable's validation; init runs without a backend.
      TF_VAR_state_passphrase: ci-placeholder-passphrase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Pester (Tofu)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tests'
          $configuration.Filter.Tag = 'Tofu'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration
